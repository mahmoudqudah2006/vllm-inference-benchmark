[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-inference-benchmark"
version = "0.1.0"
description = "A reproducible benchmark harness for vLLM and OpenAI-compatible LLM inference servers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mahmoud Alqudah" }]
dependencies = [
  "httpx>=0.27,<1.0",
  "typer>=0.12,<1.0",
  "rich>=13.7,<15.0",
  "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]
plot = ["matplotlib>=3.9,<4.0"]

[project.scripts]
vllm-bench = "vllm_inference_benchmark.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
